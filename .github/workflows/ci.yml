name: CI

on:
  push:
    branches: [main]
  pull_request:

# Dariten Mabl IDs (not secrets). Override by changing these defaults.
# Only MABL_API_KEY is a repository secret — do not commit an API key.
env:
  MABL_WORKSPACE_ID: Tyl0bVDkrVJ7yJn9DF6Elg-w
  MABL_APPLICATION_ID: IzDXT4hknwruhKOu7DOyaA-a
  MABL_ENVIRONMENT_ID: NmGUfHqpSgZFF0DInEGpDg-e

jobs:
  verify:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    env:
      # Prisma generate reads DATABASE_URL from the schema; no live database is required for this job.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Official mabl GitHub Action: creates a deployment event and runs plans
  # bound to the Dariten application + Vercel environment.
  # https://github.com/mablhq/github-run-tests-action
  # REST equivalent: POST https://api.mabl.com/events/deployment
  # Skipped until repository secret MABL_API_KEY is set (CI/CD Integration key).
  mabl-cloud-run:
    name: Mabl cloud run
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MABL_API_KEY != ''
    runs-on: ubuntu-latest
    env:
      MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
    steps:
      - name: Trigger mabl deployment event
        id: mabl-test-deployment
        uses: mablhq/github-run-tests-action@v1
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          application-id: ${{ env.MABL_APPLICATION_ID }}
          environment-id: ${{ env.MABL_ENVIRONMENT_ID }}
          app-url: https://dariten.vercel.app
